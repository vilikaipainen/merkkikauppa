<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store</title>
<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background: #f6f6f6;
        margin: 0;
    }
    h1 { text-align: center; font-size: 24px; margin-bottom: 20px; }
    
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 20px;
        max-width: 600px;
        margin: 0 auto;
    }

    @media (max-width: 900px) { 
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 20px;
        max-width: 600px;
        margin: 0 auto;
    }
 }
    @media (max-width: 600px) { 
        
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 20px;
        max-width: 600px;
        margin: 0 auto;
    }

        body { padding: 10px; }
    }
    .store-item {
        background: white;
        padding: 12px;
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        text-align: center;
    }
    .store-item img {
        width: 100%;
        height: auto;
        max-height: 200px;
        object-fit: cover;
        border-radius: 8px;
    }
    .store-item h3 { margin: 10px 0 8px; font-size: 18px; }
    button {
        margin-top: 10px;
        padding: 12px;
        width: 100%;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
    }
    button:hover { background: #005fcc; }
    .modal-bg {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.5);
        justify-content: center;
        align-items: center;
        padding: 20px;
    }
    .modal {
        background: white;
        padding: 25px;
        border-radius: 12px;
        width: 90%;
        max-width: 350px;
        text-align: center;
    }
    .modal button {
        width: 45%;
        margin: 8px;
        font-size: 16px;
        padding: 12px;
    }
    .cancel-btn { background: #888; }
</style>
</head>
<body>
<h1>Store</h1>
<h2 id="pointsDisplay">Points: 0</h2>
<div class="grid" id="grid"></div>
<div id="confirmModal" class="modal-bg">
    <div class="modal">
        <h3 id="modalText">Are you sure you want to buy this item?</h3>
        <button class="confirm-btn" onclick="confirmPurchase()">Yes</button>
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
    </div>
</div>
<script>
function updatePointsDisplay() {
    const points = Number(localStorage.getItem("points") || 0);
    document.getElementById("pointsDisplay").textContent = "Points: " + points;
}

updatePointsDisplay();

let ITEMS = {};
function loadData() {
    fetch("/data.json")
        .then(res => res.json())
        .then(data => {
            ITEMS = data;
            buildGrid();
        });
}
console.log("ITEMS BEFORE LOAD:", ITEMS);

function buildGrid() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    for (let i = 1; i <= 9; i++) {
        const item = ITEMS[i];
        const div = document.createElement("div");
        div.className = "store-item";
        div.innerHTML = `
            <img src="${item.image}" alt="${item.name}">
            <h3>${item.name}</h3>
            <button onclick="openModal(${i})">Buy</button>
        `;
        grid.appendChild(div);
    }
}
let selectedItem = null;
function openModal(id) {
    selectedItem = id;
    const item = ITEMS[id];
    document.getElementById("modalText").textContent =
        "Buy " + item.name + " for " + item.price + " points?";
    document.getElementById("confirmModal").style.display = "flex";
}

}
function closeModal() {
    document.getElementById("confirmModal").style.display = "none";
}
function confirmPurchase() {
    const item = ITEMS[selectedItem];
    let points = Number(localStorage.getItem("points") || 0);

    if (points < item.price) {
        alert("Not enough points!");
        return;
    }

    // vähennä pisteet
    points -= item.price;
    localStorage.setItem("points", points);

    // päivitä näkymä
    updatePointsDisplay();

    closeModal();

    alert("You purchased: " + item.name + "! (-" + item.price + " points)");
}

loadData();
</script>
</body>
</html>
