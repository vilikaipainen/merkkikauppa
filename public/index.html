<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
    body {
        font-family: "Poppins", sans-serif;
        padding: 20px;
        background: #f6f6f6;
        margin: 0;
        overflow-x: hidden;
    }
    h1 { text-align: center; font-size: 26px; margin-bottom: 10px; font-weight: 600; }
    h2 { text-align: center; }

    .slider-container {
        width: 100%;
        overflow: hidden;
        position: relative;
        max-width: 600px;
        margin: 0 auto;
    }
    .slider {
        display: flex;
        transition: transform 0.35s ease;
        will-change: transform;
    }
    .store-item {
        width: 50%;
        min-width: 50%;
        box-sizing: border-box;
        padding: 12px;
        background: white;
        margin: 10px 0;
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        text-align: center;
    }
    .store-item img {
        width: 90%;
        max-height: 200px;
        object-fit: cover;
        border-radius: 8px;
    }

    .slider-controls {
        display: flex;
        justify-content: center;
        margin-top: 10px;
        gap: 20px;
    }
    .slider-controls button {
        padding: 10px 18px;
        font-size: 16px;
        border-radius: 8px;
        background: #007bff;
        color: white;
        border: none;
    }
    .slider-controls button:hover { background: #005fcc; }

    .modal-bg {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.5);
        justify-content: center;
        align-items: center;
        padding: 20px;
    }
    .modal {
        background: white;
        padding: 25px;
        border-radius: 12px;
        width: 90%;
        max-width: 350px;
        text-align: center;
    }
    .modal button {
        width: 45%;
        margin: 8px;
        font-size: 16px;
        padding: 12px;
    }
    .cancel-btn {
        background: #888;
    }
</style>
</head>

<body>

<h1>Store</h1>
<h2 id="pointsDisplay">Points: 0</h2>

<div class="slider-container" id="sliderContainer">
    <div class="slider" id="slider"></div>
</div>

<div class="slider-controls">
    <button onclick="prevSlide()">←</button>
    <button onclick="nextSlide()">→</button>
</div>

<div id="confirmModal" class="modal-bg">
    <div class="modal">
        <h3 id="modalText">Are you sure?</h3>
        <button onclick="confirmPurchase()">Yes</button>
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
    </div>
</div>

<script>

/* ---------- COMMUNICATION WITH APPSMITH ----------- */
let CURRENT_POINTS = 0;

// Request total points from Appsmith
window.parent.postMessage({ type: "requestPoints" }, "*");

// Receive points from Appsmith
window.addEventListener("message", (event) => {
    if (!event.data || !event.data.type) return;

    if (event.data.type === "sendPoints") {
        CURRENT_POINTS = Number(event.data.value || 0);
        updatePointsDisplay();
    }

    if (event.data.type === "pointsUpdated") {
        CURRENT_POINTS = Number(event.data.value || 0);
        updatePointsDisplay();
    }
});
